[versions]
user-silo = "1.1.4-SNAPSHOT"
opentelemetry-logback-appender = "2.28.0-alpha"

[libraries]
spring-boot-restclient = { module = "org.springframework.boot:spring-boot-restclient" }
spring-boot-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
user-silo-web = { module = "io.github.siloverse.user-silo:web", version.ref = "user-silo" }

micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-logback-appender" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }

[plugins]

[bundles]
spring-security = ["spring-boot-oauth2-client", "spring-boot-oauth2-resource-server"]
user-silo = ["user-silo-web"]
siloverse-observability = [
    "micrometer-registry-prometheus",
    "opentelemetry-exporter-otlp",
    "micrometer-tracing-bridge-otel",
    "spring-boot-starter-opentelemetry",
    "opentelemetry-logback-appender"
]